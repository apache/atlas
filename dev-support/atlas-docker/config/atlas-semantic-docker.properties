# Semantic search overlay (merged at container start).
# OpenSearch connection reuses atlas.graph.index.search.* from the base config.
# Embeddings live on the JanusGraph vertex index ({index-name}_vertex_index).
# Indexing is done by the standalone atlas-semantic-indexer service — not inside Atlas.

atlas.search.semantic.enable=true
atlas.search.semantic.opensearch.model.id=WYwutaAB5V2FgPNec4dv
atlas.search.semantic.opensearch.embedding.dimension=384
atlas.search.semantic.min.score=0.0
atlas.search.semantic.retry.max.attempts=3
atlas.search.semantic.retry.sleep.ms=500
atlas.semantic.indexer.kafka.group.id=atlas_semantic_indexer
atlas.semantic.indexer.batch.size=25
# Semantic indexer only — applied in SemanticIndexer.main, not Atlas server entity consumers
atlas.semantic.indexer.kafka.poll.timeout.ms=5000
atlas.semantic.indexer.health.enabled=true
atlas.semantic.indexer.health.port=8089
atlas.semantic.indexer.health.path=/health
