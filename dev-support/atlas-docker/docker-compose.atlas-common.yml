services:
  atlas-solr:
    build:
      context: .
      dockerfile: Dockerfile.atlas-solr
    image: atlas-solr
    container_name: atlas-solr
    hostname: atlas-solr.example.com
    networks:
      - atlas
    ports:
      - "8983:8983"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8983/solr/admin/info/system || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  atlas-opensearch:
    build:
      context: .
      dockerfile: Dockerfile.atlas-opensearch
    image: atlas-opensearch
    container_name: atlas-opensearch
    hostname: atlas-opensearch.example.com
    networks:
      - atlas
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  atlas-opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.7.0
    container_name: atlas-opensearch-dashboards
    hostname: atlas-opensearch-dashboards.example.com
    networks:
      - atlas
    environment:
      - OPENSEARCH_HOSTS=["http://atlas-opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - I18N_LOCALE=en
    ports:
      # Host 15601 avoids Chrome localStorage conflicts with other Kibana/OSD on 5601
      - "15601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  atlas-kafka:
    build:
      context: .
      dockerfile: Dockerfile.atlas-kafka
      args:
        - KAFKA_VERSION=${KAFKA_VERSION}
        - ATLAS_VERSION=${ATLAS_VERSION}
    image: atlas-kafka
    container_name: atlas-kafka
    hostname: atlas-kafka.example.com
    stdin_open: true
    tty: true
    networks:
      - atlas
    ports:
      - "9092:9092"
    depends_on:
      atlas-zk:
        condition: service_started
    environment:
      - KAFKA_VERSION
      - ATLAS_VERSION

  atlas-zk:
    build:
      context: .
      dockerfile: Dockerfile.atlas-zk
    image: atlas-zk
    container_name: atlas-zk
    hostname: atlas-zk.example.com
    networks:
      - atlas
    ports:
      - "2181:2181"

  atlas-db:
    image: postgres:13.21
    container_name: atlas-db
    hostname: atlas-db.example.com
    networks:
      - atlas
    environment:
      POSTGRES_PASSWORD: atlasR0cks!
    healthcheck:
      test: 'su -c "pg_isready -q" postgres'
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 40s
